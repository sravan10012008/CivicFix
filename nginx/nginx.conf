events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream civicfix_backend {
        zone civicfix_backend 64k;
        server civicfix-api:5000 resolve;
    }

    server {
        listen 80;

        location /api/ {
            # Allow the local Vite frontend
            add_header Access-Control-Allow-Origin "http://localhost:5173" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey" always;

            # Handle browser preflight requests
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://civicfix_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location / {
            return 200 "CivicFix load balancer is running. Use /api/instance to test the backend.\n";
            add_header Content-Type text/plain;
        }
    }
}