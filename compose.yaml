services:
  civicfix-api:
    build:
      context: ./server
    image: civicfix-api:assignment3
    environment:
      PORT: 5000
      NODE_ENV: production
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - civicfix-net

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      civicfix-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - civicfix-net

networks:
  civicfix-net:
    driver: bridge
